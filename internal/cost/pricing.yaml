# LoopGuard model prices (LLD §8.2), in USD per million tokens.
#
# LoopGuard shows "API-equivalent" cost: token usage priced at the API
# rates below. On a subscription plan you don't pay per token; the number
# says what the same work would cost through the API.
#
# Edit freely: LoopGuard never overwrites this file. A model's entry is
# used when `match` equals the model id (a trailing -YYYYMMDD date or
# [suffix] is ignored), or matches it as a glob (`*`, `?`). The first
# matching entry wins. A model with no entry, or an entry whose `checked`
# is "unverified", has its tokens counted and its cost shown as unknown
# (loopguard doctor lists them).
#
# cache_write_per_mtok is the 5-minute cache, cache_write_1h_per_mtok the
# one-hour cache (Claude Code mostly writes the one-hour cache).
# fast_multiplier applies to fast-mode messages (usage.speed "fast"),
# us_multiplier to US-only inference (usage.inference_geo "us").
# long_prompt: a message whose prompt (input + cache writes + cache
# reads) is over above_tokens uses those prices instead.

currency: USD
# Optional display currency, shown next to USD. You set the rate (units of
# the display currency per USD); LoopGuard never fetches it.
currency_display: ""   # e.g. INR
fx_rate: 0             # e.g. 84.0

models:
  - match: claude-fable-5-1
    input_per_mtok: 10
    output_per_mtok: 50
    cache_write_per_mtok: 12.50
    cache_write_1h_per_mtok: 20
    cache_read_per_mtok: 0.25
    us_multiplier: 1.1
    source: https://platform.claude.com/docs/en/about-claude/pricing
    checked: "2026-10-21"
